<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CodeWizardProtech | Dashboard GitHub</title>
  <meta name="description" content="Dashboard profissional com estatísticas, gráficos e repositórios do perfil CodeWizardProtech no GitHub.">
  <meta property="og:title" content="CodeWizardProtech | Dashboard GitHub">
  <meta property="og:description" content="Dashboard profissional com estatísticas, gráficos e repositórios do perfil CodeWizardProtech no GitHub.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/repos.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="dashboard">
    <header class="topbar">
      <h1 class="brand">MarcosDev</h1>
      <div class="topbar-actions">
        <span id="status" class="status" data-state="loading" aria-live="polite" aria-atomic="true">Carregando dados...</span>
        <button id="refresh" class="btn btn-ghost" type="button" aria-label="Atualizar dados do perfil">Atualizar</button>
      </div>
    </header>

    <p id="error" class="error" hidden role="alert"></p>

    <section id="profile" class="panel profile" aria-label="Perfil do usuário"></section>

    <section id="metrics" class="metrics" aria-label="Métricas do perfil"></section>

    <section class="charts" aria-label="Gráficos de estatísticas">
      <article class="panel chart-card">
        <h2>Linguagens</h2>
        <div id="chart-languages"></div>
      </article>
      <article class="panel chart-card">
        <h2>Top repositórios por estrelas</h2>
        <div id="chart-stars"></div>
      </article>
      <article class="panel chart-card chart-wide">
        <h2>Atividade dos repositórios</h2>
        <div id="chart-activity"></div>
      </article>
    </section>

    <section class="panel" aria-label="Repositórios recentes">
      <h2>Repositórios recentes</h2>
      <div id="repos" class="repo-list"></div>
    </section>

    <footer class="footer">Dados públicos da API do GitHub · atualização automática a cada 60s</footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
