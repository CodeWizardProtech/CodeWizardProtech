<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CodeWizardProtech | GitHub Dashboard</title>
  <meta name="description" content="Professional dashboard with stats, charts and repositories from the CodeWizardProtech GitHub profile.">
  <meta property="og:title" content="CodeWizardProtech | GitHub Dashboard">
  <meta property="og:description" content="Professional dashboard with stats, charts and repositories from the CodeWizardProtech GitHub profile.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/repos.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="dashboard">
    <header class="topbar">
      <h1 class="brand">MarcosDev</h1>
      <div class="topbar-actions">
        <span id="status" class="status" data-state="loading" aria-live="polite" aria-atomic="true">Loading data...</span>
        <button id="refresh" class="btn btn-ghost" type="button" aria-label="Refresh profile data">Refresh</button>
      </div>
    </header>

    <p id="error" class="error" hidden role="alert"></p>

    <section id="profile" class="panel profile" aria-label="User profile"></section>

    <nav class="social-nav" aria-label="Social links">
      <a href="https://github.com" class="btn btn-primary" target="_blank" rel="noopener noreferrer">Ver no GitHub</a>
      <a href="#" class="nav-link" target="_blank" rel="noopener noreferrer">Site/Blog</a>
      <a href="https://x.com" class="nav-link" target="_blank" rel="noopener noreferrer">X / Twitter</a>
      <a href="https://github.com" class="nav-link" target="_blank" rel="noopener noreferrer">🐙 GitHub Alt</a>
      <a href="https://linkedin.com" class="nav-link" target="_blank" rel="noopener noreferrer">🔗 LinkedIn</a>
      <a href="https://instagram.com" class="nav-link" target="_blank" rel="noopener noreferrer">📷 Instagram</a>
    </nav>

    <section id="metrics" class="metrics" aria-label="Profile metrics"></section>

    <section class="charts" aria-label="Statistics charts">
      <article class="panel chart-card">
        <h2>Languages</h2>
        <div id="chart-languages"></div>
      </article>
      <article class="panel chart-card">
        <h2>Top repositories by stars</h2>
        <div id="chart-stars"></div>
      </article>
      <article class="panel chart-card chart-wide">
        <h2>Repository activity</h2>
        <div id="chart-activity"></div>
      </article>
    </section>

    <section class="panel" aria-label="Recent repositories">
      <h2>Recent repositories</h2>
      <div id="repos" class="repo-list"></div>
    </section>

    <footer class="footer">Developed by Marcos Oliveira · <span id="footer-date"></span></footer>
  <script>document.getElementById('footer-date').textContent = new Date().toLocaleDateString('en-US', { day: '2-digit', month: 'long', year: 'numeric' });</script>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/background.js"></script>
</body>
</html>
